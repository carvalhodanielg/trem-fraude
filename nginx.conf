events {
  worker_connections 2048;
  multi_accept on;
}
http {
  access_log  off;        # elimina write syscall por request no nginx
  error_log   /dev/null;  # elimina I/O de logs de erro

  upstream api {
    server api_1:8080;
    server api_2:8080;
    keepalive 128;
  }
  server {
    listen 9999;
    location / {
      proxy_pass         http://api;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
    }
  }
}
