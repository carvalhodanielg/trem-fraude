events {
  worker_connections 2048;
  multi_accept on;
}
http {
  upstream api {
    server api_1:8080;
    server api_2:8080;
    keepalive 128;
  }
  server {
    listen 9999;
    location / {
      proxy_pass         http://api;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
    }
  }
}
