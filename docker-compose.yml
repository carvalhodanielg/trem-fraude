services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api_1:
        condition: service_healthy
      api_2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "10MB"

  api_1:
    image: ghcr.io/carvalhodanielg/trem-fraude:latest
    pull_policy: always
    environment:
      - GOMAXPROCS=1
      - GOMEMLIMIT=145MiB
      - GOGC=100  # NÃO usar off: heap inflava ~113MB e despejava o índice mmap → reclaim direto → p99 estourava. Diag cgroup: p99 4895ms→2ms com GC ligado.
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/ready" ]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 65s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

  api_2:
    image: ghcr.io/carvalhodanielg/trem-fraude:latest
    pull_policy: always
    environment:
      - GOMAXPROCS=1
      - GOMEMLIMIT=145MiB
      - GOGC=100  # NÃO usar off: heap inflava ~113MB e despejava o índice mmap → reclaim direto → p99 estourava. Diag cgroup: p99 4895ms→2ms com GC ligado.
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/ready" ]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 65s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

networks:
  default:
    driver: bridge
