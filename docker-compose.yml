services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api_1:
        condition: service_healthy
      api_2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: "10MB"

  api_1:
    build: .
    environment:
      - GOMAXPROCS=1
      - GOMEMLIMIT=145MiB
      - GOGC=off
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/ready" ]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "170MB"

  api_2:
    build: .
    environment:
      - GOMAXPROCS=1
      - GOMEMLIMIT=145MiB
      - GOGC=off
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/ready" ]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "170MB"

networks:
  default:
    driver: bridge
