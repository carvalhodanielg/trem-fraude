services:
  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api_1:
        condition: service_healthy
      api_2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "10MB"

  api_1:
    build: .
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/ready" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

  api_2:
    build: .
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/ready" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "170MB"

networks:
  default:
    driver: bridge
